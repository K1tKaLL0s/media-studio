<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f3ef">
  <title>媒体工作台</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-i18n-aria="brand" aria-label="媒体工作台">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span><strong data-i18n="brand"></strong><small data-i18n="brandNote"></small></span>
    </a>
    <div class="top-actions">
      <button id="connection-button" class="connection-pill" type="button" aria-haspopup="dialog"><span class="status-dot" aria-hidden="true"></span><span id="connection-label"></span></button>
      <label class="language-control"><span class="sr-only" data-i18n="language"></span><select id="language-select" data-i18n-aria="language" aria-label="界面语言"><option value="zh">中文</option><option value="en">英文</option></select></label>
      <button id="settings-button" class="icon-button" type="button" data-i18n-aria="connectionSettings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg></button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="nav-heading"><span data-i18n="tools"></span><span class="tool-count">08</span></div>
      <nav id="profile-nav" data-i18n-aria="tools" aria-label="创作工具"></nav>
      <div class="sidebar-footer"><span class="small-line"></span><p data-i18n="localNote"></p><a id="advanced-link" href="http://127.0.0.1:8188" target="_blank" rel="noopener noreferrer"><span data-i18n="advanced"></span><span aria-hidden="true">↗</span></a></div>
    </aside>
    <main class="editor">
      <div class="editor-heading"><div><div class="eyebrow"><span id="profile-number"></span><span data-i18n="create"></span></div><h1 id="profile-title"></h1></div><span id="profile-badge" class="model-badge"></span></div>
      <p id="profile-description" class="editor-description"></p>
      <div id="profile-warning" class="profile-warning" hidden></div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="creation-form" novalidate>
        <div id="form-fields"></div>
        <div class="form-footer"><button id="example-button" class="text-button" type="button" data-i18n="loadExample"></button><span id="form-hint" class="form-hint"></span></div>
        <div class="submit-area"><button id="run-button" class="primary-button" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg><span id="run-label"></span></button><p id="run-help" class="run-help"></p></div>
      </form>
    </main>
    <aside class="inspector">
      <section class="resources" aria-labelledby="resources-title"><div class="section-title"><h2 id="resources-title" data-i18n="resources"></h2><button id="refresh-button" class="text-button" type="button" data-i18n="refresh"></button></div><div id="resource-content"></div><div class="resource-footer"><span id="idle-status"></span><button id="free-button" class="text-button" type="button" data-i18n="freeMemory"></button></div></section>
      <section class="results" aria-labelledby="results-title"><div class="section-title"><h2 id="results-title" data-i18n="result"></h2><span id="job-status" class="state-label"></span></div><div id="result-content" aria-live="polite"></div><div id="job-actions"></div><details id="technical-details" hidden><summary data-i18n="technicalDetails"></summary><pre id="technical-content"></pre></details></section>
      <p class="privacy-note" data-i18n="privacyNote"></p>
    </aside>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form" method="dialog" novalidate><div class="dialog-heading"><h2 id="settings-title" data-i18n="connectionSettings"></h2><button id="close-settings" class="icon-button" type="button" data-i18n-aria="close">×</button></div><label for="gateway-url" data-i18n="gatewayAddress"></label><input id="gateway-url" type="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8190"><p class="field-help" data-i18n="gatewayHelp"></p><p class="connection-guidance" data-i18n="networkPermissionHelp"></p><p id="settings-error" class="field-error" role="alert" hidden></p><div class="dialog-actions"><button id="reset-gateway" type="button" class="text-button" data-i18n="useLocalGateway"></button><button id="save-settings" type="submit" class="primary-button" data-i18n="saveAndConnect"></button></div></form></dialog>
  <noscript><p class="noscript">请启用 JavaScript 后使用媒体工作台。JavaScript is required to use Media Studio.</p></noscript>
</body>
</html>
